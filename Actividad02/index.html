<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesador de imágenes con WebAssembly</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="container">
        <h1>Procesador de imágenes</h1>
        <p class="intro">Cargá una imagen y convertí sus píxeles a escala de grises utilizando C y WebAssembly.</p>

        <section class="controls">
            <label for="imageInput">Seleccionar imagen</label>
            <input type="file" id="imageInput" accept="image/*">
            <button id="processButton" disabled>Convertir a escala de grises</button>
            <p id="status">Cargando módulo WebAssembly...</p>
        </section>

        <section class="images">
            <div class="image-card">
                <h2>Imagen original</h2>
                <canvas id="originalCanvas"></canvas>
            </div>
            <div class="image-card">
                <h2>Imagen procesada</h2>
                <canvas id="resultCanvas"></canvas>
            </div>
        </section>
    </main>

    <script>
        var Module = {
            onRuntimeInitialized() {
                window.wasmReady = true;
                window.dispatchEvent(new Event("wasm-ready"));
                document.getElementById("status").textContent =
                    "WebAssembly está listo. Seleccioná una imagen.";
            },
            onAbort(error) {
                document.getElementById("status").textContent =
                    "No se pudo iniciar WebAssembly: " + error;
            }
        };
    </script>
    <script src="grayscale.js"></script>
    <script src="script.js"></script>
</body>
</html>
